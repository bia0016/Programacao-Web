<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Atividade 4</title>
</head>
<body>
    <main class="bloco-central">
        <h1>Atividade 4 - Arrow Functions</h1>
        <p>Calcule o valor do seu abastecimento</p>
        <h2>Tabela de preços</h2>
        <ul>
            <li><span>Gasolina: </span><span class="preco">R$ 6,69</span></li>
            <li><span>Etanol: </span><span class="preco">R$ 4,30</span></li>
            <li><span>Diesel: </span><span class="preco">R$ 6,03</span></li>
        </ul>
        <form id="formularioAbastecimento">
            <label for="combustivel">Tipo de Combustível</label>
            <select name="combustivel" id="combustivel">
                <option value="">Escolha uma opção</option>
                <option value="gasolina">Gasolina</option>
                <option value="etanol">Etanol</option>
                <option value="diesel">Diesel</option>
            </select>
            <label for="litros">Quantidade (litros)</label>
            <input type="number" min="0" step="0.1" id="litros" placeholder="Ex: 30.5">
        </form>
        <p id="resultado"></p>
    </main>
    
    <script src="script.js"></script>
</body>
</html>
