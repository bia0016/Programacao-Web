<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade JS</title>
    <style>
        h1{
            color:white;
        }
        h2{
            color:white;
        }
        p{
            color:white;
        }
    </style>
</head>
<body style="background-color: black;">
    <h1>Atividade JS da Disciplina de PW</h1>
    <hr>
    <h2>Atividade 1</h2>
    <p>Descubra um valor de 0 a 20</p>
    <input type="number" id="nro">
    <button onclick="find()">encontrar</button>
    <p id="dica"></p>
    <p id="saida"></p>
    <hr>
    <h2>Atividade 2</h2>
    <p>Escolha <b>pedra</b>, <b>papel</b> ou <b>tesoura</b>.</p>
    <button onclick="jogar('pedra')">pedra</button>
    <button onclick="jogar('papel')">papel</button>
    <button onclick="jogar('tesoura')">tesoura</button>
    <p id="escComp"></p>
    <p id="result"></p>
    <hr>
    <h2>Atividade 3</h2>
    <label for="" style="color: white;">Digite um número: </label>
    <input type="number" id="n1">
    <button onclick="calcular()">calcular</button>
    <ul id="listaTabuada" style="color: white"></ul>
    <hr>
    <h2>Atividade 4</h2>
    <label for="" style="color:white">Digite a quantidade de linhas:</label>
    <input type="number" id="n2">
    <button onclick="lines()">clique</button>
    <p id="p"></p>
    <hr>
    <h2>Atividade 5</h2>
    <p>Digite um valor para calcular</p>
    <input type="number" id="exit">
    <button onclick="somar()">calcular</button>
    <p id="p1"></p>

    <script src="atividades.js"></script>
</body>
</html>
